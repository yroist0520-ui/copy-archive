<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>键盘测试 — COPY ARCHIVE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px 20px 60px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #F7F7F5; color: #1a1a1a; line-height: 1.7;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; color: #555; margin: 0 0 22px; }
    input, textarea {
      display: block; width: 100%; font-size: 17px;
      padding: 16px; margin: 0 0 18px;
      border: 2px solid #1a1a1a; border-radius: 10px;
      background: #fff; color: #1a1a1a;
      -webkit-user-select: text; user-select: text;
    }
    textarea { min-height: 110px; resize: vertical; }
    .box {
      background: #fff; border: 1px solid #ddd; border-radius: 12px;
      padding: 18px; margin-bottom: 22px;
    }
    .tag { font-size: 12px; color: #888; letter-spacing: .05em; }
    .ok { color: #0a7d3c; font-weight: 600; }
    .bad { color: #c0392b; font-weight: 600; }
    a { color: #1a1a1a; }
  </style>
</head>
<body>
  <h1>键盘测试</h1>
  <p>点下面任意一个框，看键盘会不会弹出来。这个页面没有任何脚本干预。</p>

  <div class="box">
    <div class="tag">测试 1 · 单行输入框</div>
    <input type="text" placeholder="点这里，然后打字…" autocomplete="off">
    <div class="tag">测试 2 · 多行输入框</div>
    <textarea placeholder="点这里，然后打字…"></textarea>
  </div>

  <div class="box">
    <p style="margin:0 0 10px"><strong>怎么判断：</strong></p>
    <p style="margin:0 0 8px"><span class="ok">✅ 能打字</span> → 你的 iPad 键盘正常，问题在档案馆代码里，请把结果告诉我。</p>
    <p style="margin:0"><span class="bad">❌ 也弹不出键盘</span> → 是这台 iPad 的系统/设置问题，跟档案馆无关。请检查：设置 → 辅助功能 → 键盘「屏幕键盘」是否开启；是否连着蓝牙键盘；或重启 iPad。</p>
  </div>

  <p><a href="./?sharecode=HC3YZORW3G">← 返回档案馆</a></p>
</body>
</html>
