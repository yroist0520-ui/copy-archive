<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>COPY ARCHIVE</title></head>
<body>
<script>
  // GitHub Pages 单页应用深链兜底。
  // 静态托管无法知道应用挂在哪一级目录，因此逐级向上探测 index.html
  // 定位应用根，然后回到入口由 main.js 恢复路由。
  // 若网关依赖 sharecode 放行，回跳时必须原样带上，否则会 403。
  (function () {
    var levels = ['./', '../', '../../', '../../../', '../../../../'];
    // hash 必须一并保存：投稿链接把数据放在 #ct= 里，丢了就再也取不回
    var saved = location.pathname + location.search + location.hash;
    var share = new URLSearchParams(location.search).get('sharecode');
    var suffix = share ? '?sharecode=' + encodeURIComponent(share) : '';

    function probe(index) {
      if (index >= levels.length) {
        location.replace('./' + suffix);
        return;
      }
      fetch(levels[index] + 'index.html' + suffix, { method: 'GET', cache: 'no-store' })
        .then(function (res) {
          if (res.ok) {
            sessionStorage.setItem('ca_redirect', saved);
            location.replace(levels[index] + suffix);
          } else {
            probe(index + 1);
          }
        })
        .catch(function () { probe(index + 1); });
    }

    probe(0);
  })();
</script>
</body>
</html>
