<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="COPY ARCHIVE — 个人文案档案馆。收集、整理、复制与分享属于你的文字。">
  <meta name="theme-color" content="#f5f3ee">
  <title>COPY ARCHIVE — 个人文案档案馆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 字体样式表异步加载：外网字体不可达或缓慢时，页面不再被阻塞渲染 -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap">
  </noscript>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <a class="sr-only" href="#app">跳到主要内容</a>

  <header class="site-header">
    <div class="container header-wrap">
      <div class="header-inner">
        <a class="brand" href="/" data-link>
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="25" height="25" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="seal-clay" cx="38%" cy="30%" r="80%">
                  <stop offset="0%" stop-color="#B8453A"/>
                  <stop offset="62%" stop-color="#A23429"/>
                  <stop offset="100%" stop-color="#8D2B22"/>
                </radialGradient>
              </defs>
              <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#seal-clay)"/>
              <rect x="10.5" y="10.5" width="43" height="43" rx="7.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.52" stroke-width="1.5"/>
              <g fill="none" stroke="#FFFFFF" stroke-width="6.8" stroke-linejoin="miter">
                <path d="M17.5 32.5 V17.5 H35"/>
                <path d="M29 46.5 H46.5 V31.5"/>
              </g>
            </svg>
          </span>
          <span class="brand-name">Copy Archive</span>
        </a>
        <nav class="main-nav" aria-label="主导航">
          <a class="nav-link" href="/" data-link>首页</a>
          <a class="nav-link" href="/archive" data-link>文案库</a>
          <a class="nav-link" href="/categories" data-link>分类</a>
          <a class="nav-link" href="/discover" data-link>发现</a>
          <a class="nav-link" href="/profile" data-link>我的档案</a>
        </nav>
        <div class="header-actions">
          <button class="icon-btn" id="global-search" title="搜索文案" aria-label="搜索文案"></button>
          <button class="icon-btn theme-btn" id="theme-toggle" title="切换主题" aria-label="切换主题"></button>
          <a class="btn btn-sm btn-primary" href="/upload" data-link>＋ 上传</a>
          <button class="icon-btn mobile-toggle" id="mobile-toggle" aria-label="展开菜单" aria-expanded="false"></button>
          <button class="btn btn-sm" id="auth-btn">登录</button>
        </div>
      </div>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="移动导航" hidden>
      <a href="/" data-link>首页 / HOME</a>
      <a href="/archive" data-link>文案库 / ARCHIVE</a>
      <a href="/upload" data-link>上传 / UPLOAD</a>
      <a href="/categories" data-link>分类 / CATEGORIES</a>
      <a href="/favorites" data-link>我的收藏 / SAVED</a>
      <a href="/discover" data-link>发现 / DISCOVER</a>
      <a href="/profile" data-link>我的档案 / PROFILE</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>COPY ARCHIVE © <span id="year"></span> — A PERSONAL TEXT ARCHIVE</span>
      <span class="mono">KEEP WHAT MATTERS. <span class="accent">■</span></span>
    </div>
    <p class="container mode-foot" hidden>静态托管版本 · 文案数据保存在当前浏览器</p>
  </footer>

  <div class="toast-host" id="toast-host" aria-live="polite"></div>
  <div id="modal-host"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
