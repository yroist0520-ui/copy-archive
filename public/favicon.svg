<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>文案档案馆</title>
  <style>
    path { stroke: #FFFFFF; }
    @media (prefers-color-scheme: light) {
      path { stroke: #292929; }
    }
  </style>
  <!-- 案上书：摊开的书页，横线是写下的文案。深色标签栏白色，浅色自动转墨色 -->
  <g fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左页 -->
    <path d="M32 22.5 C26.5 17.3 15 15.1 7.5 18.1 L7.5 42.9 C15 40.3 26.5 42.1 32 47"/>
    <!-- 右页 -->
    <path d="M32 22.5 C37.5 17.3 49 15.1 56.5 18.1 L56.5 42.9 C49 40.3 37.5 42.1 32 47"/>
    <!-- 文案横线：左页 -->
    <path d="M15 26.3 C19 24.7 24 25.5 27.5 27.8"/>
    <path d="M15 32.9 C19 31.3 24 32.1 27.5 34.4"/>
    <!-- 文案横线：右页 -->
    <path d="M36.5 27.8 C40 25.5 45 24.7 49 26.3"/>
    <path d="M36.5 34.4 C40 32.1 45 31.3 49 32.9"/>
  </g>
</svg>
